<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>soko_serch</title>
<style>
:root{--bg:#000;--card:#0e0e0e;--line:#262626;--ink:#f2f2f2;--mut:#8a8a8a;--acc:#f5c451;--link:#8ab4ff;--mark:#5a4510}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#tabbar{display:flex;gap:4px;padding:6px 8px 0;background:#080808;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;min-width:110px;max-width:200px;padding:7px 12px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:#121212;color:var(--mut);font-size:13px}
.tab.on{background:var(--bg);color:var(--ink);border-color:#3a3a3a}
.tab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;cursor:pointer}
.tab i{font-style:normal;padding:0 4px;border-radius:50%;cursor:pointer}.tab i:hover{background:#2a2a2a}
#plus{border:0;background:none;color:var(--ink);font-size:20px;padding:0 12px}
#nav{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
#nav>button{width:38px;height:38px;border:1px solid var(--line);background:var(--card);border-radius:50%;font-size:18px}
#nav>button:disabled{opacity:.3;cursor:default}
.box{display:flex;background:var(--card);border:1px solid #333;border-radius:999px;overflow:hidden}
.box:focus-within{border-color:var(--acc)}
.box input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:10px 18px;outline:none;font-size:16px}
.box button{border:0;background:var(--acc);color:#111;font-weight:700;padding:0 22px}
#nf{flex:1;max-width:680px}
#view{flex:1;overflow:auto;min-height:0}
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px}
.logo{display:flex;align-items:center;gap:12px;direction:ltr;font:700 clamp(40px,9vw,64px) Georgia,serif}
.logo svg{width:.95em;height:.95em}.logo b{color:var(--acc)}
.home .box{width:min(640px,100%)}.home .box input{font-size:18px;padding:14px 20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px 20px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:7px 16px;border-radius:999px;font-size:14px}
.chips button.on{background:var(--ink);color:#000;border-color:var(--ink)}
main{max-width:800px;margin:0 auto;padding:18px 20px 60px}
.info{color:var(--mut);font-size:13px;margin-bottom:16px}
.r{display:flex;gap:16px;align-items:flex-start;margin-bottom:24px}
.rb{flex:1;min-width:0}
.u{color:var(--mut);font-size:13px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.rb a{color:var(--link);font-size:20px;text-decoration:none;cursor:pointer}.rb a:hover{text-decoration:underline}
.rb p{margin:4px 0 6px;line-height:1.8;color:#cfcfcf}
.nt{border:1px solid var(--line);background:none;color:var(--mut);border-radius:6px;font-size:12px;padding:3px 10px}
.nt:hover{color:var(--ink);border-color:#555}
.th{flex:none;width:96px;height:96px;border-radius:10px;border:1px solid var(--line);background:#161616;overflow:hidden;display:flex;align-items:center;justify-content:center;font:700 34px Georgia,serif;color:#555}
.th img{width:100%;height:100%;object-fit:cover}
mark{background:var(--mark);color:#ffe9a8;border-radius:3px;padding:0 2px}
.pg{display:flex;gap:8px}.pg button{border:1px solid var(--line);background:var(--card);padding:8px 18px;border-radius:8px}
.empty{padding:24px 0;line-height:2;color:var(--mut)}
.pbar{display:flex;gap:14px;align-items:center;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px;color:var(--mut);flex-wrap:wrap}
.pbar a{color:var(--link)}.pbar b{color:var(--ink);font-weight:600}
.pw{display:flex;flex-direction:column;height:100%}
iframe{flex:1;width:100%;border:0;background:#fff}
.doc{white-space:pre-wrap;line-height:2}
.add{max-width:800px;margin:16px auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.add input,.add textarea{display:block;width:100%;margin:0 0 8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#000;color:var(--ink);font:inherit}
.add textarea{min-height:80px}
.add .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add button{border:1px solid var(--line);background:#161616;padding:7px 14px;border-radius:8px}
.off{display:flex;gap:16px;align-items:center;border:1px solid #3a3a3a;background:var(--card);border-radius:14px;padding:16px;margin-bottom:26px}
.oh{font-size:20px;font-weight:700}
.orow{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.go{background:var(--acc);color:#111;font-weight:700;padding:8px 18px;border-radius:999px;text-decoration:none}
.hid{display:none}
</style>
</head>
<body>
<div id="tabbar"></div>
<div id="nav">
  <button id="bk" title="الصفحة السابقة" aria-label="السابق">&rarr;</button>
  <button id="fw" title="الصفحة التالية" aria-label="التالي">&larr;</button>
  <button id="rl" title="تحديث" aria-label="تحديث">&#8635;</button>
  <form class="box" id="nf"><input id="nq" placeholder="ابحث..." autocomplete="off"><button>بحث</button></form>
</div>
<div id="view"></div>

<script>
const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const SRC=[{id:"ar",name:"الويب العربي (ويكيبيديا)"},{id:"en",name:"English web (Wikipedia)"},{id:"my",name:"فهرسي"}];

/* ===== تطبيع عربي + BM25 ===== */
const MAP={"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ى":"ي","ة":"ه"};
const clean=s=>s.normalize("NFKC").replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/\s+/g," ").trim();
const fold=s=>s.replace(/[أإآٱىة]/g,c=>MAP[c]).toLowerCase();
const stem=t=>{const m=t.replace(/^(وال|بال|كال|فال|لل|ال)/,"");return m.length>=3?m:t};
const toks=s=>(fold(s).match(/[\p{L}\p{N}]+/gu)||[]).map(stem);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let docs=[];try{docs=JSON.parse(localStorage.getItem("soko_docs")||"[]")}catch(e){}
const persist=()=>{try{localStorage.setItem("soko_docs",JSON.stringify(docs))}catch(e){}};
function localSearch(q){
  const qt=[...new Set(toks(q))];if(!qt.length||!docs.length)return[];
  const N=docs.length,L=docs.map(d=>{const t=toks(d.title+" "+d.title+" "+d.title+" "+d.text);return{tf:t.reduce((m,w)=>(m[w]=(m[w]||0)+1,m),{}),len:t.length}});
  const avg=L.reduce((a,b)=>a+b.len,0)/N||1;
  return docs.map((d,i)=>{let s=0;qt.forEach(w=>{const n=L.filter(x=>x.tf[w]).length,f=L[i].tf[w]||0;
    if(f)s+=Math.log(1+(N-n+.5)/(n+.5))*f*2.4/(f+1.4*(.25+.75*L[i].len/avg))});return{d,s}})
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.d);
}
function snip(text,qt){
  const f=fold(text),words=[...f.matchAll(/[\p{L}\p{N}]+/gu)];
  const hit=words.find(m=>qt.includes(stem(m[0])));
  const s=Math.max(0,(hit?hit.index:0)-80),e=s+280;let out="",last=s;
  for(const m of words){if(m.index<s||m.index+m[0].length>e)continue;
    if(qt.includes(stem(m[0]))){out+=esc(text.slice(last,m.index))+"<mark>"+esc(text.slice(m.index,m.index+m[0].length))+"</mark>";last=m.index+m[0].length}}
  return(s?"… ":"")+out+esc(text.slice(last,e))+" …";
}

/* ===== بحث حي (ويكيبيديا) مع صور الصفحات ===== */
async function wiki(lang,q,p){
  const api=`https://${lang}.wikipedia.org/w/api.php?format=json&origin=*&action=query&`;
  const j=await(await fetch(api+`list=search&srsearch=${encodeURIComponent(q)}&srlimit=10&sroffset=${(p-1)*10}`)).json();
  const list=j.query.search,img={};
  if(list.length)try{
    const k=await(await fetch(api+`prop=pageimages&piprop=thumbnail&pithumbsize=200&titles=${encodeURIComponent(list.map(x=>x.title).join("|"))}`)).json();
    Object.values(k.query.pages||{}).forEach(pg=>{if(pg.thumbnail)img[pg.title]=pg.thumbnail.source});
  }catch(e){}
  return{hits:j.query.searchinfo.totalhits,items:list.map(x=>({
    url:`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(x.title.replace(/ /g,"_"))}`,title:x.title,img:img[x.title],
    html:esc(x.snippet.replace(/<span class="searchmatch">/g,"\u0001").replace(/<\/span>/g,"\u0002").replace(/<[^>]+>/g,"").replace(/&quot;/g,'"').replace(/&amp;/g,"&"))
      .replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>")+" …"}))};
}

/* ===== التابات والتنقل ===== */
let tabs=[],act=0,uid=0,rt=0;
const cur=()=>tabs.find(t=>t.id===act);
function addTab(entry){const t={id:++uid,h:[entry||{t:"h"}],i:0,src:"ar"};tabs.push(t);act=t.id;render()}
function nav(e){const t=cur();t.h=t.h.slice(0,t.i+1);t.h.push(e);t.i++;render()}
function closeTab(id){const k=tabs.findIndex(t=>t.id===id);tabs.splice(k,1);
  if(!tabs.length)return addTab();if(act===id)act=tabs[Math.min(k,tabs.length-1)].id;render()}
const titleOf=e=>e.t==="s"?e.q:e.t==="h"?"تاب جديد":e.title||"صفحة";
const doSearch=q=>{q=q.trim();if(q)nav({t:"s",q,src:cur().src,p:1})};

function renderTabs(){const b=$("tabbar");b.innerHTML="";
  tabs.forEach(t=>{const d=el("div","tab"+(t.id===act?" on":""));const s=el("span","",titleOf(t.h[t.i]));
    s.onclick=()=>{act=t.id;render()};const x=el("i","","×");x.title="إغلاق";x.onclick=ev=>{ev.stopPropagation();closeTab(t.id)};d.append(s,x);b.append(d)});
  const p=el("button","","+");p.id="plus";p.title="تاب جديد";p.onclick=()=>addTab();b.append(p)}

function chips(t,activeSrc){const c=el("div","chips");
  SRC.forEach(s=>{const b=el("button",s.id===activeSrc?"on":"",s.name);b.onclick=()=>{t.src=s.id;const e=t.h[t.i];
    if(e.t==="s")nav({t:"s",q:e.q,src:s.id,p:1});else render()};c.append(b)});return c}

function panel(){const a=el("div","add");
  const u=el("input");u.placeholder="رابط الصفحة (اختياري)";u.dir="ltr";
  const ti=el("input");ti.placeholder="العنوان";
  const tx=el("textarea");tx.placeholder="الصق نص الصفحة هنا ليتفهرس";
  const r=el("div","row"),cnt=el("span","",docs.length+" صفحة");cnt.style.cssText="color:var(--mut);font-size:13px";
  const add=el("button","","أضف للفهرس"),ex=el("button","","تصدير"),im=el("button","","استيراد"),cl=el("button","","مسح الفهرس");
  const f=el("input","hid");f.type="file";f.accept=".json";
  add.onclick=()=>{const t=clean(tx.value);if(!t)return;docs.push({url:u.value.trim(),title:clean(ti.value)||"بدون عنوان",text:t});persist();u.value=ti.value=tx.value="";cnt.textContent=docs.length+" صفحة"};
  ex.onclick=()=>{const l=el("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(docs)],{type:"application/json"}));l.download="soko_index.json";l.click()};
  im.onclick=()=>f.click();
  f.onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(Array.isArray(j)){docs=docs.concat(j.filter(d=>d.title&&d.text));persist();cnt.textContent=docs.length+" صفحة"}}catch(x){alert("ملف غير صالح")}};
  cl.onclick=()=>{if(confirm("مسح كل الصفحات المفهرسة؟")){docs=[];persist();cnt.textContent="0 صفحة"}};
  r.append(add,ex,im,cl,cnt,f);a.append(u,ti,tx,r);return a}

function thumb(x){const d=el("div","th");const tile=()=>{d.innerHTML="";d.textContent=(x.title||"?").trim().charAt(0).toUpperCase()};
  let src=x.img;if(!src&&x.url)try{src="https://icons.duckduckgo.com/ip3/"+new URL(x.url).hostname+".ico"}catch(e){}
  if(src){const i=el("img");i.loading="lazy";i.referrerPolicy="no-referrer";i.alt="";i.src=src;i.onerror=tile;d.append(i)}else tile();return d}

function openItem(x,inNew){const e=x.url?{t:"p",url:x.url,title:x.title}:{t:"d",title:x.title,text:x.text};inNew?addTab(e):nav(e)}

/* ===== المواقع الرسمية (اختصارات) ===== */
const SITES=[
["YouTube","https://www.youtube.com","yt","youtube","يوتيوب"],
["ChatGPT","https://chatgpt.com","chatgpt","chat gpt","gpt","شات جي بي تي","شات جبت"],
["Claude","https://claude.ai","claude","كلود"],
["Facebook","https://www.facebook.com","facebook","fb","فيسبوك","فيس بوك"],
["Instagram","https://www.instagram.com","instagram","insta","انستجرام","انستغرام"],
["X (Twitter)","https://x.com","twitter","x","تويتر"],
["TikTok","https://www.tiktok.com","tiktok","تيك توك"],
["WhatsApp","https://web.whatsapp.com","whatsapp","واتساب","واتس اب"],
["Telegram","https://web.telegram.org","telegram","تيليجرام"],
["Gmail","https://mail.google.com","gmail","جيميل"],
["Google","https://www.google.com","google","جوجل"],
["Wikipedia","https://www.wikipedia.org","wikipedia","ويكيبيديا"],
["GitHub","https://github.com","github","جيت هاب"],
["LinkedIn","https://www.linkedin.com","linkedin","لينكدان"],
["Netflix","https://www.netflix.com","netflix","نتفليكس"],
["Amazon","https://www.amazon.com","amazon","امازون"],
["Reddit","https://www.reddit.com","reddit","ريديت"],
["Spotify","https://open.spotify.com","spotify","سبوتيفاي"],
["Snapchat","https://www.snapchat.com","snapchat","سناب شات"],
["Pinterest","https://www.pinterest.com","pinterest","بنترست"],
["Twitch","https://www.twitch.tv","twitch","تويتش"],
["Bing","https://www.bing.com","bing","بينج"],
["DuckDuckGo","https://duckduckgo.com","duckduckgo","ddg"],
["Outlook","https://outlook.live.com","outlook","hotmail","هوتميل"],
["Microsoft","https://www.microsoft.com","microsoft","ميكروسوفت"],
["Apple","https://www.apple.com","apple","ابل"],
["Noon","https://www.noon.com/egypt-ar","noon","نون"],
["Jumia","https://www.jumia.com.eg","jumia","جوميا"],
["Vodafone Egypt","https://web.vodafone.com.eg","vodafone","فودافون"],
["Yalla Kora","https://www.yallakora.com","yallakora","يلا كورة"],
["Kooora","https://www.kooora.com","kooora","كورة"]
];
const keyOf=s=>fold(s).replace(/[^\p{L}\p{N}]/gu,"");
const SM={};SITES.forEach(s=>s.slice(2).concat(s[0]).forEach(a=>SM[keyOf(a)]=s));
function officialCard(q){
  let name,url;const s=SM[keyOf(q)];
  if(s){name=s[0];url=s[1]}
  else{const m=q.trim().match(/^(https?:\/\/)?((?:[\w-]+\.)+[a-z]{2,})(\/\S*)?$/i);if(!m)return null;url=(m[1]||"https://")+m[2]+(m[3]||"");name=m[2]}
  const c=el("div","off"),b=el("div","rb"),row=el("div","orow");
  const a=el("a","go","فتح الموقع الرسمي ↗");a.href=url;a.target="_blank";a.rel="noopener";
  const n=el("button","nt","فتح هنا جوه soko_serch");n.onclick=()=>nav({t:"p",url,title:name});
  row.append(a,n);b.append(el("div","oh",name+" — الموقع الرسمي"),el("div","u",url),row);
  c.append(thumb({title:name,url}),b);return c}

async function searchView(v,t,e,tk){
  v.append(chips(t,e.src));if(e.src==="my")v.append(panel());
  const m=el("main"),info=el("div","info","بيدوّر..."),list=el("div"),pg=el("div","pg");if(e.p===1){const oc=officialCard(e.q);if(oc)m.append(oc)}
  m.append(info,list,pg);v.append(m);
  let r;
  try{
    if(e.src==="my"){const all=localSearch(e.q),qt=[...new Set(toks(e.q))];
      r={hits:all.length,items:all.slice((e.p-1)*10,e.p*10).map(d=>({url:d.url,title:d.title,text:d.text,html:snip(d.text,qt)}))}}
    else r=await wiki(e.src,e.q,e.p);
  }catch(x){if(tk!==rt)return;info.textContent="";list.append(el("div","empty","البحث الحي محتاج اتصال بالإنترنت، ومش بيشتغل جوه صفحة منشورة محمية. نزّل الملف وافتحه من جهازك، أو استخدم تبويب «فهرسي»."));return}
  if(tk!==rt)return;
  info.textContent=r.hits?`حوالي ${r.hits.toLocaleString("ar-EG")} نتيجة`:"";
  if(!r.items.length)list.append(el("div","empty","مفيش نتائج. جرّب كلمات تانية"+(e.src==="my"?"، أو ضيف صفحات للفهرس من فوق.":".")));
  r.items.forEach(x=>{const d=el("div","r"),b=el("div","rb");
    b.append(el("div","u",x.url||"(صفحة محفوظة في فهرسك)"));
    const a=el("a","",x.title);if(x.url)a.href=x.url;
    a.onclick=ev=>{ev.preventDefault();openItem(x,ev.ctrlKey||ev.metaKey)};a.onauxclick=ev=>{if(ev.button===1){ev.preventDefault();openItem(x,true)}};
    const s=el("p");s.innerHTML=x.html;const n=el("button","nt","فتح في تاب جديد");n.onclick=()=>openItem(x,true);
    b.append(a,s,n);d.append(b,thumb(x));list.append(d)});
  if(e.p>1){const b=el("button","","السابق");b.onclick=()=>nav({...e,p:e.p-1});pg.append(b)}
  if(e.p*10<r.hits){const b=el("button","","التالي");b.onclick=()=>nav({...e,p:e.p+1});pg.append(b)}
}

function homeView(v,t){
  const h=el("div","home");
  const lg=el("div","logo");lg.innerHTML='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M6 44V22a18 18 0 0 1 36 0v22"/><circle cx="22" cy="24" r="7" stroke="#f5c451"/><path d="m27 29 7 7" stroke="#f5c451"/></svg>soko<b>_</b>serch';
  const f=el("form","box"),i=el("input"),b=el("button","","بحث");i.placeholder="ابحث...";i.autocomplete="off";b.type="submit";
  f.append(i,b);f.onsubmit=ev=>{ev.preventDefault();doSearch(i.value)};
  h.append(lg,f,chips(t,t.src));if(t.src==="my")h.append(panel());v.append(h);setTimeout(()=>i.focus(),0)}

function pageView(v,e){
  const w=el("div","pw"),bar=el("div","pbar");
  const a=el("a","","فتح في نافذة جديدة ↗");a.href=e.url;a.target="_blank";a.rel="noopener";
  bar.append(el("b","",e.title),a,el("span","","لو الموقع مش بيظهر هنا، فهو بيمنع عرضه جوه صفحات تانية. استخدم الرابط ده."));
  const f=el("iframe");f.src=e.url;f.referrerPolicy="no-referrer";f.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms allow-popups");
  w.append(bar,f);v.append(w)}

function docView(v,e){const m=el("main");m.append(el("h2","",e.title),el("div","doc",e.text));v.append(m)}

function render(){
  const t=cur(),e=t.h[t.i],v=$("view"),tk=++rt;
  renderTabs();$("bk").disabled=t.i<=0;$("fw").disabled=t.i>=t.h.length-1;
  $("nq").value=e.t==="s"?e.q:"";document.title=(e.t==="h"?"":titleOf(e)+" - ")+"soko_serch";
  v.innerHTML="";
  if(e.t==="h")homeView(v,t);else if(e.t==="s")searchView(v,t,e,tk);else if(e.t==="p")pageView(v,e);else docView(v,e);
}
$("bk").onclick=()=>{const t=cur();if(t.i>0){t.i--;render()}};
$("fw").onclick=()=>{const t=cur();if(t.i<t.h.length-1){t.i++;render()}};
$("rl").onclick=render;
$("nf").onsubmit=ev=>{ev.preventDefault();doSearch($("nq").value)};
addTab();
</script>
</body>
</html>
